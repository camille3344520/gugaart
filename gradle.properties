# `-XX:ErrorFile=gugaart-hs_err_%p.log` 是本构建守护进程的【标记】（JVM 参数会留在守护进程命令行上）：和上游 native
# （标记 gugu-native-hs_err）以及机器上其它 Gradle 构建区分开，互不复用、互不误停。scripts/gw.mjs --and-stop 用一次性守护进程。
org.gradle.jvmargs=-Xmx2048m -XX:+UseSerialGC -Dfile.encoding=UTF-8 -XX:ErrorFile=gugaart-hs_err_%p.log
org.gradle.caching=true
org.gradle.parallel=true
org.gradle.configuration-cache=false
# 不另起 Kotlin 编译守护进程（少一个要清理的后台进程）。
kotlin.compiler.execution.strategy=in-process
kotlin.code.style=official
android.useAndroidX=true
android.nonTransitiveRClass=true

# ---- 上游（docs/upstream-sync.md）----
# gugugagaemby/native 的位置，相对本仓库根目录或绝对路径。日常 = 同级主检出；发版 = upstream.lock 那个提交的干净检出。
gugaart.nativeDir=../gugugagaemby/native
# false = 不挂 :player-android、不建 :shell-android（只动桌面时配置更快；:ui 的 Android 目标还在）。
gugaart.android=true
# 手机 flavor 的 minSdk（33 = AGSL 实时玻璃，和上游一致）。
gugaart.mobileMinSdk=33

# ---- 版本：唯一的地方 ----
gugaart.version=1.6.3

# Compose 的 jpackage 任务默认会去下载 WiX（35 MB）；未经批准不下载。
compose.desktop.application.downloadWix=false
# macOS 打包（M2-9）：这台 Mac 的 JDK 21 是 Homebrew 的，Compose 默认拒绝它（compose-multiplatform#3107：Homebrew 的 JDK 可能依赖
# /opt/homebrew 下的库）。关掉这道检查，改由 packageMacDmg 之后的 accept-mac --package 核对包里没有任何 Mach-O 依赖 /opt/homebrew。
compose.desktop.packaging.checkJdkVendor=false

# ---- 发版（docs/release.md）：安装包发到本仓库（公开，GPL-3.0）的 Releases ----
gugaart.releaseRepo=camille3344520/gugaart
