<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<title>咕咕嘎嘎 · macOS · 整块屏幕</title>
<link rel="stylesheet" href="menu.css">
<style>
/* 「整块屏幕」壳：系统菜单栏 / 刘海那一条 / 系统的画中画小窗，窗口本体（board.html）放在 iframe 里。这里画的全是 macOS 自己画的东西，不是画报语言。 */
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;background:#000;overflow:hidden}
#mbar{position:absolute;left:0;top:0;right:0;display:none}
#strip{position:absolute;left:0;top:0;right:0;height:37px;background:#000;display:none;pointer-events:none;z-index:50}
/* 刘海本身（示意；真机上它和黑条同色，肉眼不可见） */
#strip::after{content:"";position:absolute;left:50%;top:0;width:190px;height:33px;margin-left:-95px;background:#0a0a0a;border-radius:0 0 11px 11px;box-shadow:inset 0 -1px 0 rgba(255,255,255,.06)}
#win{position:absolute;left:0;top:0;width:100%;height:100%;border:0;background:#100E0B;display:block}
body.windowed #win{top:24px;height:calc(100% - 24px);border-radius:10px 10px 0 0}
body.windowed{background:#0b0a08}
body.notch:not(.player) #win{top:37px;height:calc(100% - 37px)}
body.menu #mbar,body.notch #strip{display:flex}
body.menu #mbar{display:flex}
body.notch #mbar{height:37px;background:transparent}
/* 系统的画中画小窗：浮在屏幕角上，谁也盖不住它；内容就是画面本身（字幕 / 弹幕由内核画在画面里） */
#pipwin{position:absolute;right:24px;bottom:24px;width:320px;height:180px;border-radius:10px;overflow:hidden;background:#000 center/cover no-repeat;box-shadow:0 0 0 .5px rgba(255,255,255,.2),0 18px 50px rgba(0,0,0,.65);display:none}
body.pipwin #pipwin{display:block}
#pipwin .ctl{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;gap:18px;background:rgba(0,0,0,.35);opacity:0;transition:opacity .15s}
#pipwin:hover .ctl,body.shot #pipwin .ctl{opacity:1}
#pipwin .ctl a{width:34px;height:34px;border-radius:17px;background:rgba(255,255,255,.18);display:grid;place-items:center;color:#fff}
#pipwin .ctl svg{width:16px;height:16px;fill:#fff;display:block}
#pipwin .x{position:absolute;left:10px;top:8px;width:22px;height:22px;border-radius:11px;background:rgba(0,0,0,.5);color:#fff;display:grid;place-items:center;font:13px -apple-system,sans-serif}
#pipwin .sub{position:absolute;left:0;right:0;bottom:7%;text-align:center;color:#fff;font:600 12px "PingFang SC",sans-serif;text-shadow:0 0 3px #000,0 1px 2px #000}
</style>
</head>
<body>
<div id="mbar"></div>
<div id="strip"></div>
<iframe id="win" title="咕咕嘎嘎"></iframe>
<div id="pipwin"><div class="sub">江大人，这一路，怕是不太平。</div><a class="x">✕</a><div class="ctl"><a title="回到窗口"><svg viewBox="0 0 16 16"><path d="M2 3h12v10H2z" fill="none" stroke="#fff" stroke-width="1.4"/><path d="M8 7h5v5H8z"/></svg></a><a title="暂停"><svg viewBox="0 0 16 16"><path d="M4 3h3v10H4zM9 3h3v10H9z"/></svg></a><a title="关闭"><svg viewBox="0 0 16 16"><path d="M3.5 3.5l9 9M12.5 3.5l-9 9" stroke="#fff" stroke-width="1.6" fill="none"/></svg></a></div></div>
<script src="macos-menu.js"></script>
<script>
(function () {
const Q = new URLSearchParams(location.search), p = Q.get('p') || 'home', body = document.body;
const fs = !!(Q.get('fs') || Q.get('full') || Q.get('notch')), notch = !!Q.get('notch'), menu = !!Q.get('menu'), player = p === 'player';
body.classList.toggle('menu', menu); body.classList.toggle('notch', notch); body.classList.toggle('player', player); body.classList.toggle('windowed', menu && !fs);
if (Q.get('shot')) body.classList.add('shot');
if (Q.get('pipwin') || Q.get('st') === 'pip') { body.classList.add('pipwin'); window.PACK = (k, v) => { if (k === '56342-backdrop') document.getElementById('pipwin').style.backgroundImage = `url(${v})`; }; const s = document.createElement('script'); s.src = '../desktop/pack/56342-backdrop.js'; document.head.appendChild(s); }
// 窗口本体：把屏幕层的参数剥掉，带上窗口层需要的（fs = 红绿灯归系统；player + notch = 刘海插边）
const inner = new URLSearchParams(location.search); ['menu', 'open', 'np', 'pipwin', 'notch', 'annot'].forEach((k) => inner.delete(k)); inner.set('inner', '1');
if (fs) inner.set('fs', '1'); if (player && fs) inner.set('full', '1'); if (player && notch) inner.set('notch', '1');
const win = document.getElementById('win'); win.src = 'board.html?' + inner.toString();
// 菜单栏：标题 / 命令 / 键位是我们定的，画法是系统的；命令发给窗口
if (menu || Q.get('np')) { body.classList.add('menu'); MacMenu.mount(document.getElementById('mbar'), { context: player ? 'player' : p === 'wall' ? 'wall' : 'page', notch, annot: !!Q.get('annot'), nowPlaying: player || Q.get('np') ? {} : false,
  openTitle: Q.get('open') != null ? (isNaN(+Q.get('open')) ? Q.get('open') : +Q.get('open')) : null, openNP: !!Q.get('np'), onCommand: (cmd) => win.contentWindow.postMessage({ mac: 'cmd', cmd }, '*') }); }
// 就绪标志给截图脚本：能读到 iframe 就等它的 data-ready，读不到（file:// 隔离）就等加载后 3 秒
let n = 0; win.addEventListener('load', () => { const t = setInterval(() => { try { if (win.contentDocument.body.dataset.ready === '1' || ++n > 120) { body.dataset.ready = '1'; clearInterval(t); } } catch (e) { if (++n > 12) { body.dataset.ready = '1'; clearInterval(t); } } }, 250); });
})();
</script>
</body>
</html>
